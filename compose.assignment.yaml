# Assignment OVERRIDE for compose.prod.yaml — evaluation, not certified production.
#
# This file is an override layer, applied on top of the base stack per Docker's
# multiple-compose-file merge rules (https://docs.docker.com/compose/how-tos/multiple-compose-files/merge/):
# mappings such as `environment` are merged key-by-key and sequences such as
# `volumes` are appended.
#
#   cp .env.assignment.example .env.assignment
#   docker compose -f compose.prod.yaml -f compose.assignment.yaml \
#     --env-file .env.assignment up -d --build
#
# What it changes:
#   * selects the self-hosted Playwright provider for the API;
#   * starts the isolated browser service (Chromium lives THERE, never in the API);
#   * shares one private credential vault volume between the API and the service so
#     one-time browser-login `vault://` references resolve on both sides;
#   * enables You.com Search + Contents (Research stays off).
#
# Deployment properties that are deliberate:
#   * no `ports:` on browser-worker — RPC (8081) and VNC (5900) stay on the private
#     network; only caddy publishes anything;
#   * interactive noVNC is exposed only through Caddy's exact, Basic-Auth-protected
#     same-origin WebSocket path;
#   * exactly one Playwright session owns the container's single X display;
#   * raw credentials never cross the RPC boundary — only `vault://` references do.

services:
  api:
    environment:
      BROWSER_PROVIDER: playwright
      ALLOW_LIVE_BROWSER: "true"
      # The API speaks authenticated RPC to the service and never launches Chromium.
      BROWSER_SERVICE_URL: http://browser-worker:8081
      BROWSER_SERVICE_TOKEN: ${BROWSER_SERVICE_TOKEN:?BROWSER_SERVICE_TOKEN is required}
      BROWSER_SERVICE_OWNER: ${BROWSER_SERVICE_OWNER:-assignment-owner}
      BROWSER_INTERACTIVE_HITL_ENABLED: "true"
      # The SHARED encrypted vault. The control plane writes one-time, run-scoped
      # browser-login references here; the browser service consumes them once.
      # NOTE: this overrides the base stack's /data/secret_vault.db, so the
      # assignment stack keeps its credential vault on the shared volume instead.
      SECRET_VAULT_DB_PATH: /vault/credentials.db
      PLAYWRIGHT_IN_PROCESS_SANDBOX: "false"

      YDC_API_KEY: ${YDC_API_KEY:-}
      YOU_SEARCH_ENABLED: ${YOU_SEARCH_ENABLED:-true}
      YOU_CONTENTS_ENABLED: ${YOU_CONTENTS_ENABLED:-true}
      YOU_RESEARCH_ENABLED: ${YOU_RESEARCH_ENABLED:-false}
    volumes:
      - credential_vault:/vault
    depends_on:
      browser-worker:
        condition: service_healthy

  # The isolated browser service. Chromium runs HERE, so restarting the API cannot
  # kill a live session and a Chromium crash cannot take down the control plane.
  # Dockerfile.browser installs the binary (`python -m playwright install
  # --with-deps chromium`); the API image intentionally has no browser.
  browser-worker:
    build:
      context: .
      dockerfile: Dockerfile.browser
    init: true
    ipc: host
    shm_size: 1gb
    pids_limit: 512
    user: ops
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g,mode=1777
    environment:
      BROWSER_PROVIDER: playwright
      ALLOW_LIVE_BROWSER: "true"
      ALLOW_LIVE_VENDOR_EMAIL: "false"

      # Required: with no token the service refuses EVERY request (fail closed).
      BROWSER_SERVICE_TOKEN: ${BROWSER_SERVICE_TOKEN:?BROWSER_SERVICE_TOKEN is required}
      BROWSER_SERVICE_PORT: "8081"
      BROWSER_SERVICE_OWNER: ${BROWSER_SERVICE_OWNER:-assignment-owner}

      BROWSER_SESSION_INACTIVITY_SECONDS: ${BROWSER_SESSION_INACTIVITY_SECONDS:-900}
      BROWSER_SESSION_MAX_AGE_SECONDS: ${BROWSER_SESSION_MAX_AGE_SECONDS:-3600}

      # Interactive mode owns one X display, so this limit is intentionally not
      # configurable in the assignment overlay.
      PLAYWRIGHT_MAX_SESSIONS: "1"
      PLAYWRIGHT_DISABLE_SANDBOX: ${PLAYWRIGHT_DISABLE_SANDBOX:-true}

      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      CEREBRAS_MODEL: ${CEREBRAS_MODEL:-gpt-oss-120b}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-nvidia/nemotron-3-ultra-550b-a55b:free}
      GOOGLE_GENAI_API_KEY: ${GOOGLE_GENAI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}

      # Headed Chromium + loopback-only x11vnc. Caddy exposes only the signed,
      # owner-bound relay path; neither VNC nor browser RPC is published.
      BROWSER_INTERACTIVE_HITL_ENABLED: "true"
      BROWSER_DISPLAY_NUM: "99"
      BROWSER_SCREEN_GEOMETRY: "1440x900x24"
      BROWSER_VNC_PORT: "5900"
      BROWSER_LIVE_VIEW_TOKEN_SECONDS: "300"

      TZ: Asia/Singapore
      LANG: C.UTF-8

      # Storage state is encrypted at rest; with no key it is simply not persisted.
      BROWSER_STORAGE_STATE_KEY: ${BROWSER_STORAGE_STATE_KEY:-}
      BROWSER_STORAGE_STATE_DIR: /browser-data/storage-state

      # Same key and DB path as the API, or the service would receive valid
      # references it cannot resolve.
      SECRET_VAULT_KEY: ${SECRET_VAULT_KEY:?SECRET_VAULT_KEY is required}
      SECRET_VAULT_DB_PATH: /vault/credentials.db

      PYTHONPATH: /app
    volumes:
      - browser_profiles:/browser-data
      - credential_vault:/vault
    networks:
      - opsnet
    restart: unless-stopped
    stop_grace_period: 30s
    # No `ports:` on purpose: 8081 (RPC) and 5900 (VNC) are reachable only on the
    # private opsnet network. Other containers use http://browser-worker:8081.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json, sys, urllib.request
          response = urllib.request.urlopen("http://127.0.0.1:8081/internal/health", timeout=30)
          state = json.load(response).get("state")
          sys.exit(0 if state in ("ready", "configured_not_verified", "capacity_exhausted") else 1)
      interval: 60s
      timeout: 40s
      start_period: 30s
      retries: 3

  caddy:
    environment:
      # Caddy injects this fixed owner only on the exact live-view WebSocket
      # route. It must match the API and browser-worker owner above.
      BROWSER_SERVICE_OWNER: ${BROWSER_SERVICE_OWNER:-assignment-owner}

volumes:
  browser_profiles:
  # Private shared vault for one-time, run-scoped browser-login references.
  credential_vault:
