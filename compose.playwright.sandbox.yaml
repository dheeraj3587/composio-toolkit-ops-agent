# Playwright SANDBOX compose — evaluation only, never production.
#
# This file exists so the self-hosted browser harness can be exercised against a
# real Chromium build in isolation. It is deliberately NOT part of the production
# stack: compose.prod.yaml is untouched, no production volume is mounted, no port
# is published, and live browsing is OFF by default.
#
#   docker compose -f compose.playwright.sandbox.yaml --env-file .env.playwright.sandbox build
#   docker compose -f compose.playwright.sandbox.yaml --env-file .env.playwright.sandbox run --rm browser-sandbox
#   docker compose -f compose.playwright.sandbox.yaml --env-file .env.playwright.sandbox up -d browser-worker
#
# Two services, deliberately:
#   browser-sandbox — one-shot probe: does Chromium launch in this image at all?
#   browser-worker  — the long-running browser SERVICE (Chromium's own process),
#                     which is what makes an API restart survivable.
#
# See docs/PLAYWRIGHT_SANDBOX.md. Never point this at an untrusted or production
# vendor account, and never place provider secrets in this file.

services:
  browser-sandbox:
    build:
      context: .
      dockerfile: Dockerfile.browser
    image: composio-ops-browser:sandbox
    # Reap zombie Chromium children instead of leaking processes.
    init: true
    # Chromium needs a real IPC namespace and adequate shared memory; without the
    # larger /dev/shm it crashes or is forced onto --disable-dev-shm-usage.
    ipc: host
    shm_size: 1gb
    pids_limit: 512
    # Non-root (the image's `ops` user) with no privilege escalation.
    user: ops
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g,mode=1777
    environment:
      # Self-hosted provider selected, but live browsing stays OFF by default: the
      # readiness probe and offline tests do not need it.
      BROWSER_PROVIDER: playwright
      ALLOW_LIVE_BROWSER: ${ALLOW_LIVE_BROWSER:-false}
      ALLOW_LIVE_VENDOR_EMAIL: "false"
      PLAYWRIGHT_MAX_SESSIONS: ${PLAYWRIGHT_MAX_SESSIONS:-2}
      # Chromium's own sandbox stays enabled unless the host cannot support it.
      PLAYWRIGHT_DISABLE_SANDBOX: ${PLAYWRIGHT_DISABLE_SANDBOX:-false}
      PYTHONPATH: /app
    volumes:
      # A throwaway named volume for browser profiles. NEVER a production volume.
      - browser_sandbox_profiles:/browser-data
    # No `ports:` on purpose — nothing is exposed to the host or network.
    # Default command proves Chromium actually launches in this image.
    command: ["python", "-m", "ops.browser_readiness"]

  # The isolated browser service. Chromium lives HERE, not in the API container,
  # so restarting the API cannot kill a live session and a Chromium crash cannot
  # take down the control plane.
  browser-worker:
    build:
      context: .
      dockerfile: Dockerfile.browser
    image: composio-ops-browser:sandbox
    # Reap zombie Chromium children instead of leaking processes.
    init: true
    # Chromium needs a real IPC namespace and adequate shared memory.
    ipc: host
    shm_size: 1gb
    pids_limit: 512
    user: ops
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      # Chromium and Xvfb both need writable scratch space on a read_only rootfs.
      - /tmp:rw,nosuid,nodev,size=1g,mode=1777
    environment:
      BROWSER_PROVIDER: playwright
      ALLOW_LIVE_BROWSER: ${ALLOW_LIVE_BROWSER:-false}
      ALLOW_LIVE_VENDOR_EMAIL: "false"
      PLAYWRIGHT_MAX_SESSIONS: ${PLAYWRIGHT_MAX_SESSIONS:-2}
      # Chromium's own sandbox stays enabled unless the host cannot support it.
      PLAYWRIGHT_DISABLE_SANDBOX: ${PLAYWRIGHT_DISABLE_SANDBOX:-false}
      PYTHONPATH: /app
      # Required: with no token the service refuses EVERY request (fail closed).
      # Supplied via --env-file, never written into this file.
      BROWSER_SERVICE_TOKEN: ${BROWSER_SERVICE_TOKEN:-}
      BROWSER_SERVICE_PORT: "8081"
      BROWSER_SESSION_INACTIVITY_SECONDS: ${BROWSER_SESSION_INACTIVITY_SECONDS:-900}
      BROWSER_SESSION_MAX_AGE_SECONDS: ${BROWSER_SESSION_MAX_AGE_SECONDS:-14400}
      # Interactive remote control is OFF unless an operator turns it on.
      BROWSER_INTERACTIVE_HITL_ENABLED: ${BROWSER_INTERACTIVE_HITL_ENABLED:-false}
      BROWSER_VNC_PORT: "5900"
      BROWSER_NOVNC_BASE_URL: http://browser-worker:8081
      # Storage state is encrypted at rest; with no key it is simply not persisted.
      BROWSER_STORAGE_STATE_KEY: ${BROWSER_STORAGE_STATE_KEY:-}
      BROWSER_STORAGE_STATE_DIR: /browser-data/storage-state
      # The SHARED encrypted credential vault. The control plane writes one-time
      # browser-login references here and the service consumes them; without the
      # same DB and key the service would receive valid references it cannot
      # resolve. The Fernet key arrives via --env-file, NEVER inline in this file,
      # and this is an EPHEMERAL sandbox vault — never the production vault.
      SECRET_VAULT_KEY: ${SECRET_VAULT_KEY:-}
      SECRET_VAULT_DB_PATH: /vault/credentials.db
    volumes:
      # A throwaway named volume for browser profiles and encrypted storage state.
      # NEVER a production volume.
      - browser_profiles:/browser-data
      # The shared, private, ephemeral credential vault (same volume the
      # integration-test/control-plane service mounts).
      - credential_vault:/vault
    networks:
      - opsnet
    # No `ports:` on purpose. The RPC surface (8081) and the VNC port (5900) are
    # reachable only on this private network / container loopback — never from the
    # host. Reaching the service from another container uses http://browser-worker:8081.
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json, sys, urllib.request
          response = urllib.request.urlopen("http://127.0.0.1:8081/internal/health", timeout=30)
          state = json.load(response).get("state")
          sys.exit(0 if state in ("ready", "configured_not_verified", "capacity_exhausted") else 1)
      interval: 60s
      timeout: 40s
      start_period: 30s
      retries: 3

  # Runs the real-Chromium and RPC suites against browser-worker over the private
  # network. No published port: tests reach the service at http://browser-worker:8081.
  # Shares the SAME ephemeral vault volume so a service-backed login round-trips.
  browser-integration-tests:
    build:
      context: .
      dockerfile: Dockerfile.browser
    image: composio-ops-browser:sandbox
    init: true
    ipc: host
    shm_size: 1gb
    pids_limit: 512
    user: ops
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g,mode=1777
    environment:
      BROWSER_PROVIDER: playwright
      ALLOW_LIVE_BROWSER: ${ALLOW_LIVE_BROWSER:-true}
      ALLOW_LIVE_VENDOR_EMAIL: "false"
      PLAYWRIGHT_DISABLE_SANDBOX: "true"
      REQUIRE_REAL_BROWSER_TESTS: "1"
      PYTHONPATH: /app
      # Same token, vault key and DB path as browser-worker, so RPC + shared-vault
      # tests exercise the real cross-service path.
      BROWSER_SERVICE_TOKEN: ${BROWSER_SERVICE_TOKEN:-}
      BROWSER_SERVICE_URL: http://browser-worker:8081
      BROWSER_SERVICE_OWNER: ${BROWSER_SERVICE_OWNER:-ci-owner}
      SECRET_VAULT_KEY: ${SECRET_VAULT_KEY:-}
      SECRET_VAULT_DB_PATH: /vault/credentials.db
    volumes:
      - credential_vault:/vault
    networks:
      - opsnet
    # Not started by `up`; invoked explicitly with `run --rm` in CI.
    profiles:
      - ci
    # No `ports:` — this is a private test runner.
    command: ["python", "-m", "pytest", "-m", "browser", "-q"]

networks:
  opsnet:
    driver: bridge

volumes:
  browser_sandbox_profiles:
  browser_profiles:
  # A private, ephemeral shared vault for one-time browser-login references. Removed
  # after CI with `docker compose down --volumes`. Never the production vault.
  credential_vault:
