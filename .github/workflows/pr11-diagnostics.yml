name: PR11 diagnostics

on:
  push:
    branches:
      - agent/autonomous-signup-foundation-complete
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr11-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ALLOW_LIVE_BROWSER: "false"
      ALLOW_LIVE_VENDOR_EMAIL: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      RUN_LIVE_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-providers.txt
            requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run backend diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          statuses=()
          run_check() {
            local name="$1"
            shift
            "$@" >"diagnostics/${name}.log" 2>&1
            local status=$?
            printf '%s=%s\n' "$name" "$status" | tee -a diagnostics/statuses.txt
            statuses+=("$status")
          }
          mapfile -d '' files < <(git ls-files -z --cached --others --exclude-standard)
          run_check detect-secrets detect-secrets-hook --baseline .secrets.baseline "${files[@]}"
          run_check ruff-check ruff check .
          run_check ruff-format ruff format --check .
          run_check mypy mypy ops api streamlit_app.py
          run_check compileall python -m compileall -q ops api streamlit_app.py
          run_check targeted-pytest pytest -q \
            tests/test_credential_capture_bundle.py \
            tests/test_browser_service_phase3.py \
            tests/test_owner_credential_submission.py \
            tests/test_self_serve_browser.py \
            tests/test_run_service.py \
            tests/test_signup_form_detection.py \
            tests/test_signup_form_fill.py \
            tests/test_signup_submission.py \
            tests/test_signup_submission_state.py \
            tests/test_signup_result_classifier.py \
            tests/test_signup_result_conflicts.py \
            tests/test_signup_result_waiter.py \
            tests/test_signup_result_state.py --tb=short -rf
          failed=0
          for status in "${statuses[@]}"; do
            if [[ "$status" != "0" ]]; then failed=1; fi
          done
          exit "$failed"
      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr11-backend-diagnostics
          path: diagnostics
          if-no-files-found: error
          retention-days: 2

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Run frontend diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          statuses=()
          run_check() {
            local name="$1"
            shift
            "$@" >"diagnostics/${name}.log" 2>&1
            local status=$?
            printf '%s=%s\n' "$name" "$status" | tee -a diagnostics/statuses.txt
            statuses+=("$status")
          }
          cd web
          run_check audit-runtime npm audit --omit=dev --audit-level=high
          run_check audit-critical npm audit --audit-level=critical
          run_check lint npm run lint
          run_check typecheck npm run typecheck
          run_check test npm run test
          run_check build npm run build
          cd ..
          failed=0
          for status in "${statuses[@]}"; do
            if [[ "$status" != "0" ]]; then failed=1; fi
          done
          exit "$failed"
      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr11-frontend-diagnostics
          path: diagnostics
          if-no-files-found: error
          retention-days: 2
