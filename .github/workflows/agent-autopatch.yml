name: Agent SDK diagnostics

# Temporary offline signature probe. This file is removed before the PR merges.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect-youdotcom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the published SDK only
        run: python -m pip install --no-cache-dir youdotcom==2.3.0
      - name: Capture SDK signatures without API calls
        shell: bash
        run: |
          python - <<'PY' > youdotcom-signatures.txt
          import inspect
          from importlib.metadata import version
          from youdotcom import You, models

          print("version", version("youdotcom"))
          you = You(api_key_auth="offline-signature-probe")

          targets = {
              "search.unified_async": you.search.unified_async,
              "contents.generate_async": you.contents.generate_async,
              "research_async": you.research_async,
          }
          for name, target in targets.items():
              print(name, inspect.signature(target))

          for name in (
              "ContentsFormats",
              "SafeSearch",
              "ResearchEffort",
              "SourceControl",
          ):
              value = getattr(models, name, None)
              print("model", name, value)
              if value is not None:
                  try:
                      print("model-signature", name, inspect.signature(value))
                  except (TypeError, ValueError):
                      pass

          print("search-resource", type(you.search).__module__, type(you.search).__name__)
          print("contents-resource", type(you.contents).__module__, type(you.contents).__name__)
          you.close()
          PY
          cat youdotcom-signatures.txt
      - uses: actions/upload-artifact@v4
        with:
          name: youdotcom-2.3-signatures
          path: youdotcom-signatures.txt
          if-no-files-found: error
          retention-days: 1
