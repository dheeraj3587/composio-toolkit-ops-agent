name: Agent SDK diagnostics

# Temporary offline signature probe. This file is removed before the PR merges.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect-youdotcom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the published SDK only
        run: python -m pip install --no-cache-dir youdotcom==2.3.0
      - name: Capture SDK signatures without API calls
        shell: bash
        run: |
          python - <<'PY' > youdotcom-signatures.txt
          import inspect
          from importlib.metadata import version
          from youdotcom import You, models
          from youdotcom.utils import retries

          print("version", version("youdotcom"))
          you = You(api_key_auth="offline-signature-probe")

          def describe(label, target):
              print("target", label, "present", target is not None)
              if target is not None:
                  try:
                      print("signature", label, inspect.signature(target))
                  except (TypeError, ValueError) as exc:
                      print("signature-error", label, type(exc).__name__)

          describe("search.unified_async", getattr(you.search, "unified_async", None))
          describe("search_post_async", getattr(you, "search_post_async", None))
          describe("contents.generate_async", getattr(you.contents, "generate_async", None))
          describe("research_async", getattr(you, "research_async", None))
          describe("RetryConfig", retries.RetryConfig)
          describe("BackoffStrategy", retries.BackoffStrategy)

          print("RetryConfig-annotations", getattr(retries.RetryConfig, "__annotations__", {}))
          print("BackoffStrategy-annotations", getattr(retries.BackoffStrategy, "__annotations__", {}))

          for name in (
              "ContentsFormats",
              "SafeSearch",
              "ResearchEffort",
              "SourceControl",
          ):
              value = getattr(models, name, None)
              print("model", name, value)
          PY
          cat youdotcom-signatures.txt
      - uses: actions/upload-artifact@v4
        with:
          name: youdotcom-2.3-signatures
          path: youdotcom-signatures.txt
          if-no-files-found: error
          retention-days: 1
