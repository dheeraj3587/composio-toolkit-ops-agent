name: Agent SDK diagnostics

# Temporary offline signature probe. This file is removed before the PR merges.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect-youdotcom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the published SDK only
        run: python -m pip install --no-cache-dir youdotcom==2.3.0
      - name: Capture SDK signatures without API calls
        shell: bash
        run: |
          python - <<'PY' > youdotcom-signatures.txt
          import inspect
          from importlib.metadata import version
          from youdotcom import You, models

          print("version", version("youdotcom"))
          you = You(api_key_auth="offline-signature-probe")

          def describe(label, owner, attribute):
              target = getattr(owner, attribute, None)
              print("target", label, "present", target is not None)
              if target is not None:
                  try:
                      print("signature", label, inspect.signature(target))
                  except (TypeError, ValueError) as exc:
                      print("signature-error", label, type(exc).__name__)

          print("you-public", [name for name in dir(you) if not name.startswith("_")])
          print("search-public", [name for name in dir(you.search) if not name.startswith("_")])
          print("contents-public", [name for name in dir(you.contents) if not name.startswith("_")])

          describe("search.unified", you.search, "unified")
          describe("search.unified_async", you.search, "unified_async")
          describe("search_post_async", you, "search_post_async")
          describe("contents.generate", you.contents, "generate")
          describe("contents.generate_async", you.contents, "generate_async")
          describe("research", you, "research")
          describe("research_async", you, "research_async")

          for name in (
              "ContentsFormats",
              "SafeSearch",
              "ResearchEffort",
              "SourceControl",
          ):
              value = getattr(models, name, None)
              print("model", name, value)
              if value is not None:
                  try:
                      print("model-signature", name, inspect.signature(value))
                  except (TypeError, ValueError):
                      pass
          PY
          cat youdotcom-signatures.txt
      - uses: actions/upload-artifact@v4
        with:
          name: youdotcom-2.3-signatures
          path: youdotcom-signatures.txt
          if-no-files-found: error
          retention-days: 1
