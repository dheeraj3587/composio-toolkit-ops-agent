name: Signup secret matrix

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: scan ${{ matrix.file }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        file:
          - api/assignment_runtime.py
          - api/models.py
          - api/service.py
          - browser_service/main.py
          - browser_service/models.py
          - ops/browser_service_client.py
          - ops/browser_worker.py
          - ops/cli.py
          - ops/gmail_identity.py
          - ops/gmail_worker.py
          - ops/graph.py
          - ops/models.py
          - ops/playwright_worker.py
          - ops/policies.py
          - ops/run_service.py
          - ops/secret_store.py
          - ops/signup_credentials.py
          - ops/state.py
          - ops/storage.py
          - tests/test_signup_foundation.py
          - web/src/app/runs/new/actions.test.ts
          - web/src/app/runs/new/actions.ts
          - web/src/components/new-run-form.test.tsx
          - web/src/components/new-run-form.tsx
          - web/src/lib/api-schemas.ts
          - web/src/lib/types.ts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m pip install -q detect-secrets==1.5.0
      - run: detect-secrets-hook --baseline .secrets.baseline "${{ matrix.file }}"
