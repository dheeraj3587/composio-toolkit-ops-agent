name: Agent diagnostics

on:
  push:
    branches:
      - agent/playwright-demo-frontend-wiring
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Capture frontend diagnostics
        working-directory: web
        shell: bash
        run: |
          set +e
          npm run lint > ../frontend-lint.log 2>&1
          echo $? > ../frontend-lint.code
          npm run typecheck > ../frontend-typecheck.log 2>&1
          echo $? > ../frontend-typecheck.code
          npm run build > ../frontend-build.log 2>&1
          echo $? > ../frontend-build.code
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-diagnostics
          path: |
            frontend-lint.log
            frontend-lint.code
            frontend-typecheck.log
            frontend-typecheck.code
            frontend-build.log
            frontend-build.code
          if-no-files-found: error
          retention-days: 1

  backend-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-providers.txt
            requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - name: Capture You.com dependency contract
        shell: bash
        run: |
          set +e
          python -m pytest tests/test_you_research.py::TestSdkContract -q > backend-contract.log 2>&1
          echo $? > backend-contract.code
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: |
            backend-contract.log
            backend-contract.code
          if-no-files-found: error
          retention-days: 1
