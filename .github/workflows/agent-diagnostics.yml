name: Agent diagnostics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Capture frontend diagnostics
        working-directory: web
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high > ../frontend-audit.log 2>&1
          echo $? > ../frontend-audit.code
          npm run lint > ../frontend-lint.log 2>&1
          echo $? > ../frontend-lint.code
          npm run typecheck > ../frontend-typecheck.log 2>&1
          echo $? > ../frontend-typecheck.code
          npm run test > ../frontend-test.log 2>&1
          echo $? > ../frontend-test.code
          npm run build > ../frontend-build.log 2>&1
          echo $? > ../frontend-build.code
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-diagnostics
          path: |
            frontend-audit.log
            frontend-audit.code
            frontend-lint.log
            frontend-lint.code
            frontend-typecheck.log
            frontend-typecheck.code
            frontend-test.log
            frontend-test.code
            frontend-build.log
            frontend-build.code
          if-no-files-found: error
          retention-days: 1

  backend-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-providers.txt
            requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - name: Capture You.com dependency contract
        shell: bash
        run: |
          set +e
          python -m pytest tests/test_you_research.py::TestSdkContract -q > backend-contract.log 2>&1
          echo $? > backend-contract.code
          mkdir -p patched/tests patched/docs
          sed 's/2\.5\.0/2.4.0/g' tests/test_you_research.py > patched/tests/test_you_research.py
          sed 's/2\.5\.0/2.4.0/g' docs/YOU_COM_INTEGRATION.md > patched/docs/YOU_COM_INTEGRATION.md
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: |
            backend-contract.log
            backend-contract.code
            patched/tests/test_you_research.py
            patched/docs/YOU_COM_INTEGRATION.md
          if-no-files-found: error
          retention-days: 1
