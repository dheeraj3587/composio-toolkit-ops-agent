name: PR11 latest main snapshot

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Archive latest main source
        run: |
          tar --exclude=.git --exclude=web/node_modules --exclude=web/.next \
            -czf /tmp/pr11-main-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: pr11-main-source
          path: /tmp/pr11-main-source.tar.gz
          if-no-files-found: error
          retention-days: 1
