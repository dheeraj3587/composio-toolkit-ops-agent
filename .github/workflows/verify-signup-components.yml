name: Verify signup backend components

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  components:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ALLOW_LIVE_BROWSER: "false"
      ALLOW_LIVE_VENDOR_EMAIL: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      RUN_LIVE_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-providers.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install -q --requirement requirements-dev.txt
          python -m playwright install --with-deps chromium >/dev/null 2>&1
      - name: Audited secret baseline
        continue-on-error: true
        run: |
          files=()
          while IFS= read -r -d '' candidate; do
            case "$candidate" in
              .secrets.baseline | PLAN.md | data/p1/SNAPSHOT.json) continue ;;
            esac
            [[ -f "$candidate" ]] && files+=("$candidate")
          done < <(git ls-files -z --cached --others --exclude-standard)
          detect-secrets-hook \
            --baseline .secrets.baseline \
            --exclude-lines '.*"secret_scope"\s*:\s*"production-classifier-smoke"' \
            --exclude-lines '.*secret\s*=\s*"signed-live-view-secret"' \
            --exclude-lines '.*"login_password"\s*:\s*"pw"' \
            "${files[@]}"
      - name: Recursive secret scan
        continue-on-error: true
        run: |
          detect-secrets scan --all-files \
            --exclude-lines '.*"secret_scope"\s*:\s*"production-classifier-smoke"' \
            --exclude-lines '.*secret\s*=\s*"signed-live-view-secret"' \
            --exclude-lines '.*"login_password"\s*:\s*"pw"' \
            --exclude-files '(?:^|/)(?:\.git|\.venv|web/node_modules|web/\.next|private)(?:/|$)' \
            >/dev/null
      - name: Ruff lint
        continue-on-error: true
        run: ruff check .
      - name: Ruff format
        continue-on-error: true
        run: ruff format --check .
      - name: Backend tests
        continue-on-error: true
        run: RUN_LIVE_TESTS=0 pytest -q
      - name: Mypy
        continue-on-error: true
        run: mypy ops api streamlit_app.py
      - name: Compileall
        continue-on-error: true
        run: python -m compileall -q ops api streamlit_app.py
      - name: Python dependency audit
        continue-on-error: true
        run: pip-audit -r requirements-dev.txt
      - name: Credential grep
        continue-on-error: true
        run: |
          grep_output="$(mktemp)"
          git grep --untracked -nEI \
            '(client_secret|access_token|refresh_token|api[_-]?key|password|private[_-]?key|PRIVATE KEY|sk-|sk_live_|rk_live_|gh[pousr]_|github_pat_|AIza|xox[baprs]-|AKIA|ASIA|pplx-|SG\.)' \
            -- ':!PLAN.md' ':!.secrets.baseline' >"${grep_output}" || true
          python - "${grep_output}" <<'PY'
          import re
          import sys

          quoted_assignment = re.compile(
              r"(?i)(?:client_secret|access_token|refresh_token|api[_-]?key|password)"
              r"\s*[:=]\s*['\"]([^'\"]+)['\"]"
          )
          shell_assignment = re.compile(
              r"(?<![A-Za-z0-9_])(?:export[ \t]+)?"
              r"(?:[A-Z0-9_]*API_KEY|[A-Z0-9_]*CLIENT_SECRET|[A-Z0-9_]*ACCESS_TOKEN|"
              r"[A-Z0-9_]*REFRESH_TOKEN|[A-Z0-9_]*PASSWORD|[A-Z0-9_]*PRIVATE_KEY|"
              r"SECRET_VAULT_KEY|LANGGRAPH_AES_KEY)"
              r"[ \t]*=[ \t]*(?!['\" \t])([^\s#;(){}\[\],]+)(?=[ \t]*(?:#|;|$))"
          )
          private_key_header = re.compile(
              r"-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----"
          )
          provider_key = re.compile(
              r"(?<![A-Za-z0-9])(?:"
              r"sk-(?:live-|test-)?[A-Za-z0-9_-]{12,}|"
              r"(?:sk|rk)_(?:live|test)_[A-Za-z0-9]{12,}|"
              r"gh[pousr]_[A-Za-z0-9]{20,}|"
              r"github_pat_[A-Za-z0-9_]{20,}|"
              r"AIza[A-Za-z0-9_-]{20,}|"
              r"xox[baprs]-[A-Za-z0-9-]{10,}|"
              r"(?:AKIA|ASIA)[0-9A-Z]{16}|"
              r"pplx-[A-Za-z0-9_-]{12,}|"
              r"SG\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}"
              r")(?![A-Za-z0-9])"
          )
          safe_prefixes = ("vault://", "[REDACTED", "${", "{")
          reviewed_fixture_fragments = {
              "deploy/kiro-smoke.py": ('"secret_scope": "production-classifier-smoke"',),
              "tests/test_browser_service_phase3.py": ('secret = "signed-live-view-secret"',),
              "tests/test_playwright_action_loop.py": ('"login_password": "pw"',),
          }
          suspicious: set[str] = set()
          with open(sys.argv[1], encoding="utf-8") as handle:
              for raw_line in handle:
                  parts = raw_line.split(":", 2)
                  if len(parts) != 3:
                      continue
                  content = parts[2]
                  if any(
                      fragment in content
                      for fragment in reviewed_fixture_fragments.get(parts[0], ())
                  ):
                      continue
                  location = f"{parts[0]}:{parts[1]}"
                  quoted_match = quoted_assignment.search(content)
                  shell_match = shell_assignment.search(content)
                  assigned_values = (
                      match.group(1)
                      for match in (quoted_match, shell_match)
                      if match is not None
                  )
                  if any(
                      value and not value.startswith(safe_prefixes)
                      for value in assigned_values
                  ):
                      suspicious.add(location)
                  if private_key_header.search(content) or provider_key.search(content):
                      suspicious.add(location)
          if suspicious:
              for location in sorted(suspicious):
                  print(location, file=sys.stderr)
              raise SystemExit(1)
          PY
