name: PR11 merge and ship

on:
  push:
    branches:
      - agent/autonomous-signup-foundation-complete

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ALLOW_LIVE_BROWSER: "false"
      ALLOW_LIVE_VENDOR_EMAIL: "false"
      RUN_LIVE_TESTS: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Merge latest main with reviewed overlap resolution
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [[ "$merge_status" != "0" ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            expected=(ops/gmail_worker.py ops/run_service.py)
            if [[ "${conflicts[*]}" != "${expected[*]}" ]]; then
              printf 'unexpected merge conflicts:\n%s\n' "${conflicts[*]}" >&2
              exit 1
            fi
            git checkout --theirs -- ops/gmail_worker.py ops/run_service.py
            git add ops/gmail_worker.py ops/run_service.py
          fi
      - name: Layer PR policy and Gmail identity deltas onto latest main
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact merge snippet, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          gmail = "ops/gmail_worker.py"
          replace_once(gmail, "import re\n", "import re\nimport time\n")
          replace_once(
              gmail,
