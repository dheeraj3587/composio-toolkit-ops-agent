# Local-only override for the canonical production topology.
#
#   docker compose -f compose.prod.yaml -f compose.local.yaml \
#     --env-file .env.production up --build
#
# The same API, web, and isolated browser-service images run locally. Caddy is
# moved behind an explicit profile while loopback ports expose API/web for normal
# development. No provider action occurs until a run is explicitly executed.

services:
  api:
    environment:
      OPS_CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      OPS_ENABLE_API_DOCS: "true"
    ports:
      - "127.0.0.1:${OPS_API_PORT:-8000}:8000"

  web:
    ports:
      - "127.0.0.1:${OPS_WEB_PORT:-3000}:3000"

  caddy:
    profiles:
      - production-proxy
